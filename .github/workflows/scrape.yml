name: Auto Scrape

# 定时自动采集（每天四次：北京 08:00 / 14:00 / 20:00 / 02:00 = UTC 0 / 6 / 12 / 18）+ 手动触发
# 说明：本 workflow 只负责抓取入库；审核通知已拆到 notify.yml 独立运行。
# 原因：GitHub Actions 的 schedule 常有 1~4 小时延迟，若在流程内用「实际运行时刻」
# 判断通知窗口会全部落空（2026-09-07 踩过这个坑）。
on:
  schedule:
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install scraper deps
        run: cd scraper && npm install --no-audit --no-fund

      - name: Run scraper
        run: cd scraper && node run.js
        env:
          # 在仓库 Settings → Secrets and variables → Actions 中配置
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          # 用于远程 main 去重（run.js 合并远程 items 键，避免重复抓取）
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPO: ${{ github.repository }}

      - name: Commit & push
        run: |
          git config user.name "zst-bot"
          git config user.email "bot@zhongsaitong.local"
          git add -A
          if git diff --cached --quiet; then
            echo "无新内容，跳过提交"
          else
            git commit -m "chore: auto-scrape $(date +%Y-%m-%d)"
            git push
          fi
