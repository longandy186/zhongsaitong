name: Auto Scrape

# 定时自动采集（每天两次：北京 07:00 / 19:00 = UTC 23 / 11）+ 手动触发
#
# 2026-11-28 起：草稿 + 人工审核那条线已取消，抓取即发布。
#   写入即 status: active + expireAt（新闻 7 天 / 交易类 30 天 / 指南 365 天），
#   到点由站点在构建时自动下线，不再有人工「待审」状态。
#   相关度门槛 RELEVANCE_MIN（默认 5）是唯一的质量闸门，低于门槛的写 status: expired。
#
# 本 workflow 只负责抓取入库并推送；部署由 deploy.yml 通过 workflow_run 自动接力
#   （GITHUB_TOKEN 推送不会触发其他 workflow，所以必须显式挂接，见 deploy.yml 注释）。
on:
  schedule:
    - cron: '0 23,11 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install scraper deps
        run: cd scraper && npm install --no-audit --no-fund

      - name: Run scraper
        run: cd scraper && node run.js
        env:
          # 在仓库 Settings → Secrets and variables → Actions 中配置
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          # 用于远程 main 去重（run.js 合并远程 items 键，避免重复抓取）
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPO: ${{ github.repository }}

      - name: Commit & push
        run: |
          git config user.name "zst-bot"
          git config user.email "bot@zhongsaitong.local"
          git add -A
          if git diff --cached --quiet; then
            echo "无新内容，跳过提交"
          else
            git commit -m "chore: auto-scrape $(date +%Y-%m-%d)"
            git push
          fi
