name: CF Analytics

# 站点流量查询：手动触发，只读不写。
# 借用仓库已有的 CLOUDFLARE_API_TOKEN secret（需含 Zone → Analytics → Read 权限）。
# 若报权限错误，需在 Cloudflare 后台为该 token 追加 Analytics 读取权限。

on:
  workflow_dispatch:
    inputs:
      days:
        description: "查询天数"
        required: false
        default: "30"

jobs:
  analytics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Cloudflare analytics
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_NAME: zhongsaitong.com
        run: python3 scraper/cf-analytics.py --days ${{ github.event.inputs.days }}
